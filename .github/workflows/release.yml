name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true

  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cssh-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: cssh-linux-x86_64-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cssh-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Collect binaries (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p release_artifacts
          cp target/${{ matrix.target }}/release/cssh release_artifacts/
          cp target/${{ matrix.target }}/release/cssh-agent release_artifacts/
          cp target/${{ matrix.target }}/release/cexec release_artifacts/

      - name: Collect binaries (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          mkdir -p release_artifacts
          copy target\${{ matrix.target }}\release\cssh.exe release_artifacts\
          copy target\${{ matrix.target }}\release\cssh-agent.exe release_artifacts\
          copy target\${{ matrix.target }}\release\cexec.exe release_artifacts\

      - name: Create tar.gz archive (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: cd release_artifacts && tar czf ../${{ matrix.artifact_name }}.tar.gz * && cd ..

      - name: Create zip archive (Windows)
        if: startsWith(matrix.os, 'windows')
        run: cd release_artifacts && 7z a ../${{ matrix.artifact_name }}.zip * && cd ..

      - name: Generate SHA256 checksums
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          cat ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Generate SHA256 checksums (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          CertUtil -hashfile ${{ matrix.artifact_name }}.zip SHA256 | findstr /v "CertUtil" > ${{ matrix.artifact_name }}.zip.sha256
          type ${{ matrix.artifact_name }}.zip.sha256

      - name: Upload Linux tar.gz to Release
        if: startsWith(matrix.os, 'ubuntu')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256
          draft: true

      - name: Upload Windows zip to Release
        if: startsWith(matrix.os, 'windows')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.zip.sha256
          draft: true

  call-publish-workflow:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Trigger publish workflow
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-crates.yml',
              ref: 'main'
            })
